<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>抖音音乐 - 发现你的心动好音乐</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== 顶部提示 Toast ===== -->
  <div class="toast" id="toast"></div>

  <!-- ===== 我的歌单 ===== -->
  <section id="myPlaylists" class="section my-playlists">
    <div class="container">
      <div class="section-head">
        <div class="head-left">
          <h2>🎧 我的歌单</h2>
        </div>
      </div>
      <div class="song-panel">
        <div class="song-panel-head" id="songPanelHead">
          <div class="head-title">
            <h3>🎵 加载中...</h3>
            <div class="playlist-meta" id="playlistMeta"></div>
          </div>
          <div class="song-actions">
            <button class="btn-action" id="playAllBtn" title="全部播放">▶ 全部播放</button>
            <button class="btn-action" id="refreshBtn" title="更新">更新</button>
          </div>
        </div>
        <ul class="song-list" id="songList"></ul>
      </div>
    </div>
  </section>

  <!-- ===== 播放条 ===== -->
  <div class="player-bar" id="playerBar">
    <div class="player-cover" id="playerCover">♫</div>
    <div class="player-info">
      <div class="player-title" id="playerTitle">未在播放</div>
      <div class="player-artist" id="playerArtist">选择一首歌开始吧</div>
    </div>
    <div class="volume">
      <button id="volumeIcon" title="静音/取消静音">🔊</button>
      <input type="range" id="volumeBar" min="0" max="100" value="80" />
    </div>
    <div class="player-controls">
      <button id="modeBtn" title="顺序播放">🔁</button>
      <button id="prevBtn">⏮</button>
      <button class="play-toggle" id="playToggle">▶</button>
      <button id="nextBtn">⏭</button>
    </div>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  </div>

  <!-- cookie 粘贴弹窗（无歌单时点「更新」弹出） -->
  <div class="modal-mask" id="cookieModal" hidden>
    <div class="modal">
      <h4>粘贴抖音 Cookie</h4>
      <p class="modal-tip">检测到还没有歌单。粘贴浏览器里的抖音 Cookie（F12 → 网络 → 请求头里的 Cookie），保存后将自动拉取收藏并创建歌单。</p>
      <textarea id="cookieInput" rows="7" placeholder="k1=v1; k2=v2; ...（也支持粘贴 JSON）"></textarea>
      <div class="modal-actions">
        <button class="btn-create ghost" id="cookieCancel">取消</button>
        <button class="btn-create" id="cookieSave">保存并拉取</button>
      </div>
    </div>
  </div>

  <script src="js/index.js"></script>
</body>
</html>
